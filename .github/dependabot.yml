version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - dependencies
    ignore:
      # A new major version of the Companion module API needs a deliberate migration of the module code
      - dependency-name: '@companion-module/base'
        update-types: ['version-update:semver-major']
      - dependency-name: '@companion-module/tools'
        update-types: ['version-update:semver-major']
